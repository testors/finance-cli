[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "finance-cli"
version = "0.1.0"
description = "Unified Korean finance CLI with shared credentials and institution adapters"
readme = "README.md"
requires-python = ">=3.10"
license-files = ["LICENSES/*.txt", "NOTICE"]
dependencies = ["cryptography>=46", "pycryptodome>=3.23", "asn1crypto>=1.5.1", "tzdata>=2024.1"]

[project.optional-dependencies]
test = ["lxml>=5", "build>=1.2"]

[project.scripts]
fin = "finance_cli.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
giro = ["*.json"]
hometax_cli = ["*.mjs", "*.cjs", "*.java", "runtime/*.json"]
